<h1>Edit Department</h1>

@if(errorSignal() != null){
<div class="alert alert-danger">
    {{ errorSignal() }}
</div>
}

<form [formGroup]="departmentForm" (ngSubmit)="updateDepartment()">

    <div class="mb-3">
        <label class="form-label">
            Name
        </label>
        <input type="text" class="form-control" formControlName="depName">
        @if(departmentForm.controls.depName.invalid &&
            departmentForm.controls.depName.touched){
                <div class="text-danger mt-1">
                    Name not valid
                </div>
            }
    </div>

    <div class="mb-3">
        <label class="form-label">
            Location
        </label>
        <input type="text" class="form-control" formControlName="depLocation">
        @if(departmentForm.controls.depLocation.invalid &&
            departmentForm.controls.depLocation.touched){
                <div class="text-danger mt-1">
                    Location not valid
                </div>
            }
    </div>

    <button class="btn btn-success" type="submit" [disabled]="isSaving()">
        Update Department
    </button>

</form>
